<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Godzilla – Kaiju Rampage 3000</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Isometrisches Kaiju-Browserspiel im Stil von SimCity 3000 – eine Fan-Hommage an die alten Godzilla-Filme.">
  <meta name="theme-color" content="#8a1010">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kaiju 3000">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" width="480" height="270"></canvas>
  <div id="touch" hidden>
    <div id="stick"><div id="knob"></div></div>
    <div id="btns">
      <button data-k="r" class="b-r">PULS</button>
      <button data-k="l" class="b-l">BRÜLL</button>
      <button data-k="k" class="b-k">STRAHL</button>
      <button data-k="j" class="b-j">SCHLAG</button>
    </div>
    <button id="tpause" data-k="p">II</button>
  </div>
  <noscript>Dieses Spiel braucht JavaScript.</noscript>
  <script src="js/raster.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/world.js"></script>
  <script src="js/game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
    }
  </script>
</body>
</html>
